name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    # The suite needs no macOS: the integration tests run against test/mock-bridge.mjs (pure Node).
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm run check
      - run: npm test
      - run: node server.mjs --version
      - run: python3 -m py_compile scripts/service_trace.py scripts/bench.py
